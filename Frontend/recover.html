<!DOCTYPE html>
<!--
  =============================================================================
  MFC Youth Area Management System
  File: recover.html
  Description: Account recovery and troubleshooting entry page.
  =============================================================================
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your password for the MFC Youth Area Management System.">
  <meta name="theme-color" content="#002847">
  <title>Reset Password - MFC Youth Area Management System</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  </style>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/img/logo-2.png">
</head>

<body class="auth-body">
  <!-- Main Recover Account Container -->
  <main class="auth-page auth-page-modern">
    <!-- Recover Account Card -->
    <section class="login-card login-card-modern animate-in" aria-labelledby="recoverTitle">
      <div class="login-header">
        <img class="logo-mark" src="/img/logo.png" alt="MFC Youth Logo">
        <h1 id="resetTitle">Set New Password</h1>
        <p>Please enter your new password below.</p>
      </div>
      <form class="login-form" id="resetPasswordForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" name="newPassword" required minlength="8">
          <small>Must be at least 8 characters with letters and numbers.</small>
        </div>
        
        <!-- Help Content -->
        <div class="form-errors auth-recovery-form" id="resetPasswordError" style="display: none; color: red; margin-bottom: 1rem;"></div>
        <div class="form-success" id="resetPasswordSuccess" style="display: none; color: green; margin-bottom: 1rem;"></div>

        <div class="login-buttons">
          <button class="btn-auth btn-primary" type="submit" id="submitBtn">Save New Password</button>
        </div>
      </form>
    </section>
  </main>
  
  <footer class="auth-footer" style="padding: 2rem; text-align: center; margin-top: auto;">
    Powered & designed by <a href="https://migzdndd.github.io/web-portfolio/" target="_blank" rel="noopener noreferrer" style="color: inherit; font-weight: bold; text-decoration: none;">migz.dev</a>
  </footer>
  <script src="/js/loader.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Look for the token_hash in the URL query string OR fragment
      // Typically it's in the query params if our endpoint specifies it via redirectTo
      // e.g. /recover?token_hash=xxx&type=recovery
      const urlParams = new URLSearchParams(window.location.search);
      let token_hash = urlParams.get('token_hash');
      
      // Fallback: Supabase sometimes uses fragment #access_token=...&type=recovery
      // But we requested a token_hash via email template configuration
      if (!token_hash && window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        token_hash = hashParams.get('token_hash'); // Custom email template handles it
      }

      if (!token_hash) {
        document.getElementById('resetPasswordError').textContent = 'Invalid or missing recovery token. Please request a new link.';
        document.getElementById('resetPasswordError').style.display = 'block';
        document.getElementById('submitBtn').disabled = true;
      } else {
        // Store the token safely and optionally remove it from URL
        window.__RECOVERY_TOKEN = token_hash;
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });

    document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newPassword = document.getElementById('newPassword').value;
      const errorDiv = document.getElementById('resetPasswordError');
      const successDiv = document.getElementById('resetPasswordSuccess');
      const submitBtn = document.getElementById('submitBtn');
      const token_hash = window.__RECOVERY_TOKEN;
      
      if (!token_hash) return;

      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token_hash, newPassword })
        });
        
        const data = await response.json();
        
        if (data.ok) {
          successDiv.textContent = data.message;
          successDiv.style.display = 'block';
          document.getElementById('resetPasswordForm').reset();
          submitBtn.style.display = 'none';
          setTimeout(() => {
            navigateWithLoader('/');
          }, 3000);
        } else {
          errorDiv.textContent = data.error || 'Failed to reset password.';
          errorDiv.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Save New Password';
        }
      } catch (err) {
        errorDiv.textContent = 'A network error occurred. Please try again.';
        errorDiv.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save New Password';
      }
    });
  </script>
</body>

</html>
