<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover Your Account - MFC Youth Area Management System</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/visby');
    </style>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/logo-2.png">
</head>

<body class="auth-body">
    <main class="auth-page">
        <div class="form-box">
            <form class="light-form" id="recoverForm"><span class="form-title">Recover Your Account</span><span
                    class="form-subtitle">Enter your email address to check your demo account.</span>
                <div id="recoverMessage"></div>
                <div class="form-container"><input class="form-input" id="recoverEmail" type="email"
                        placeholder="Email Address" required></div><button class="primary-form-button"
                    type="submit">Check Account</button>
            </form>
            <div class="form-section">Remember your password? <a href="index.html">Sign In</a></div>
        </div>
    </main>
    <script src="js/auth.js"></script>
</body>

</html>
