<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#002847">
  <title>Recover Account - MFC Youth Area Management System</title>
  <style>
    @import url('https://fonts.cdnfonts.com/css/visby');
  </style>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/img/logo-2.png">
</head>

<body class="auth-body">
  <main class="auth-page">
    <section class="login-card auth-card" aria-labelledby="recoverTitle">
      <div class="login-header">
        <img class="logo-mark" src="/img/logo.png" alt="MFC Youth Logo">
        <h1 id="recoverTitle">Reset Your Member Login</h1>
        <p>Password resets are securely issued by a Super Admin.</p>
      </div>
      <div class="login-form account-provision-info">
        <div class="verification-badge">
          <span>Forgot your password?</span>
          <strong>Ask your Super Admin to reset your account login.</strong>
        </div>
        <p class="prototype-note">The admin can open Members → Login and issue a new secure temporary password. You will be
          required to change it after signing in.</p>
        <div class="login-buttons"><button class="btn-auth btn-primary" type="button" data-navigate="/">Back
            to Sign In</button></div>
      </div>
    </section>
  </main>
  <script src="/js/loader.js"></script>
  <script src="/js/auth.js"></script>
</body>

</html>
