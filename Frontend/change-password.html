<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#002847">
  <title>Change Password - MFC Youth Area Management System</title>
  <style>
    @import url('https://fonts.cdnfonts.com/css/visby');
  </style>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/img/logo-2.png">
</head>

<body class="auth-body" data-allow-authenticated="true">
  <main class="auth-page">
    <section class="login-card auth-card" aria-labelledby="passwordPageTitle">
      <div class="login-header">
        <img class="logo-mark" src="/img/logo.png" alt="MFC Youth Logo">
        <h1 id="passwordPageTitle">Change Your Password</h1>
        <p id="passwordPageIntro">Update the password used for your MFC Youth account.</p>
      </div>
      <form class="login-form" id="forcePasswordForm" novalidate>
        <div id="passwordMessage"></div>
        <div class="verification-badge"><span>Account</span><strong id="passwordAccountEmail">-</strong></div>
        <div class="login-field">
          <input class="login-input" id="currentPassword" type="password" placeholder="Current / Temporary Password"
            autocomplete="current-password" required>
          <button class="password-toggle" type="button" data-password-toggle="currentPassword"
            aria-label="Show password">Show</button>
        </div>
        <div class="login-field">
          <input class="login-input" id="newPassword" type="password" minlength="10" placeholder="New Password"
            autocomplete="new-password" required>
          <button class="password-toggle" type="button" data-password-toggle="newPassword"
            aria-label="Show password">Show</button>
        </div>
        <div class="login-field">
          <input class="login-input" id="newPasswordConfirm" type="password" minlength="10"
            placeholder="Confirm New Password" autocomplete="new-password" required>
          <button class="password-toggle" type="button" data-password-toggle="newPasswordConfirm"
            aria-label="Show password">Show</button>
        </div>
        <p class="field-help auth-help">Use at least 10 characters with uppercase, lowercase, a number, and a symbol.</p>
        <div class="login-buttons">
          <button class="btn-auth btn-primary" type="submit">Update Password</button>
          <button class="btn-auth btn-dark" id="backToLoginButton" type="button">Back to Login</button>
        </div>
      </form>
    </section>
  </main>
  <script src="/js/loader.js"></script>
  <script src="/js/auth.js"></script>
</body>

</html>
