<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#002847">
  <title>Account Provisioning - MFC Youth Area Management System</title>
  <style>
    @import url('https://fonts.cdnfonts.com/css/visby');
  </style>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/img/logo-2.png">
</head>

<body class="auth-body">
  <main class="auth-page">
    <section class="login-card auth-card">
      <div class="login-header">
        <img class="logo-mark" src="/img/logo.png" alt="MFC Youth Logo">
        <h1>Registration Flow Updated</h1>
        <p>Public account verification is no longer used.</p>
      </div>
      <div class="login-form account-provision-info">
        <p class="prototype-note">Accounts are now created automatically when an administrator adds a member to the
          Members database.</p>
        <div class="login-buttons"><button class="btn-auth btn-primary" type="button"
            data-navigate="/register">View Account Access</button></div>
      </div>
    </section>
  </main>
  <script src="/js/loader.js"></script>
  <script src="/js/auth.js"></script>
</body>

</html>
