<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Account - MFC Youth Area Management System</title>
  <style>
    @import url('https://fonts.cdnfonts.com/css/visby');
  </style>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/logo-2.png">
</head>

<body class="auth-body">
  <main class="auth-page">
    <section class="login-card auth-card">
      <div class="login-header">
        <img class="logo-mark" src="img/logo.png" alt="MFC Youth Logo">
        <h1>Email Verification</h1>
        <p>One last step before your account is ready.</p>
      </div>

      <form class="login-form" id="confirmForm">
        <p class="login-heading">Confirm Your Email</p>
        <div id="confirmMessage"></div>

        <div class="verification-badge">
          <span>Verification sent to</span>
          <strong id="confirmEmail">your email</strong>
        </div>

        <div class="login-field">
          <svg class="input-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2 6.5A1.5 1.5 0 0 1 3.5 5h9A1.5 1.5 0 0 1 14 6.5v3A1.5 1.5 0 0 1 12.5 11h-9A1.5 1.5 0 0 1 2 9.5v-3zm2.1 0L8 8.8l3.9-2.3M2 7.4l4.8 2.8a2 2 0 0 0 2.4 0L14 7.4" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <input class="login-input" id="confirmCode" type="text" maxlength="6" inputmode="numeric" placeholder="Enter 6-digit code" required>
        </div>

        <div class="verification-code-box">
          <span>Demo verification code</span>
          <strong id="demoVerificationCode">-</strong>
        </div>

        <div class="login-buttons">
          <button class="btn-auth btn-primary" type="submit">Verify Account</button>
          <button class="btn-auth btn-dark" type="button" id="resendCodeBtn">Resend Code</button>
        </div>
      </form>

      <div class="auth-bottom">Need to go back? <a href="login.html">Sign in</a></div>
    </section>
  </main>

  <footer class="auth-footer">Visit the Official MFC Youth Page at <a href="https://mfcyouth.org" target="_blank">mfcyouth.org</a>
  </footer>
  <script src="js/auth.js"></script>
</body>

</html>
