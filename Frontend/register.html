<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - MFC Youth Area Management System</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/visby');
    </style>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/logo-2.png">
</head>

<body class="auth-body">
    <main class="auth-page">
        <div class="form-box">
            <form class="light-form" id="registerForm"><span class="form-title">Create Account</span><span
                    class="form-subtitle">Register for the MFC Youth Area Management System</span>
                <div id="registerMessage"></div>
                <div class="form-container"><input class="form-input" id="regName" type="text" placeholder="Full Name"
                        required><input class="form-input" id="regEmail" type="email" placeholder="Email Address"
                        required><input class="form-input" id="regPassword" type="password" minlength="6"
                        placeholder="Password" required><input class="form-input" id="regConfirm" type="password"
                        minlength="6" placeholder="Confirm Password" required></div><button class="primary-form-button"
                    type="submit">Create Account</button>
            </form>
            <div class="form-section">Already have an account? <a href="index.html">Sign In</a></div>
        </div>
    </main>
    <script src="js/auth.js"></script>
</body>

</html>
