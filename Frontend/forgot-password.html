<!DOCTYPE html>
<!--
  =============================================================================
  MFC Youth Area Management System
  File: forgot-password.html
  Description: Authentication recovery flow for password resets.
  =============================================================================
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Recover access to your MFC Youth Area Management System account.">
  <meta name="theme-color" content="#002847">
  <title>Forgot Password - MFC Youth Area Management System</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  </style>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/img/logo-2.png">
</head>

<body class="auth-body auth-recovery-body">
  <!-- Main Forgot Password Container -->
  <main class="auth-page auth-page-modern">
    <!-- Forgot Password Card -->
    <section class="login-card login-card-modern animate-in" aria-labelledby="forgotPasswordTitle">
      <div class="login-header auth-recovery-header">
        <img class="logo-mark" src="/img/logo.png" alt="MFC Youth Logo">
        <h1 id="forgotPasswordTitle">Forgot Your Password?</h1>
        <p>Enter the email address connected to your account and we will send you a secure recovery link.</p>
      </div>

      <!-- Recovery Form -->
      <form class="login-form login-form-modern" id="forgotPasswordForm" novalidate>
        <div class="form-group auth-recovery-field">
          <label for="email">Email Address</label>
          <input class="auth-text-input" type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="auth-alert auth-alert-error" id="forgotPasswordError" role="alert" aria-live="assertive" hidden></div>

        <div class="auth-alert auth-alert-success" id="forgotPasswordSuccess" role="status" aria-live="polite" hidden>
          <svg class="auth-alert-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <div>
            <strong>Check your email</strong>
            <span id="forgotPasswordSuccessText">If an account exists, a reset link has been sent. Please also check your spam or junk folder if you do not see it.</span>
          </div>
        </div>

        <div class="login-buttons auth-recovery-actions">
          <button class="btn-auth btn-primary auth-action-primary" type="submit" id="submitBtn">Send Recovery Link</button>
          <button class="btn-auth auth-action-secondary" type="button" id="backToSignInBtn">Back to Sign In</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="auth-footer" style="padding: 2rem; text-align: center; margin-top: auto;">
    Powered & designed by <a href="https://migzdndd.github.io/web-portfolio/" target="_blank" rel="noopener noreferrer" style="color: inherit; font-weight: bold; text-decoration: none;">migz.dev</a>
  </footer>
  <script src="/js/loader.js"></script>
  <script>
    (() => {
      const form = document.getElementById('forgotPasswordForm');
      const emailInput = document.getElementById('email');
      const errorDiv = document.getElementById('forgotPasswordError');
      const successDiv = document.getElementById('forgotPasswordSuccess');
      const successText = document.getElementById('forgotPasswordSuccessText');
      const submitBtn = document.getElementById('submitBtn');
      const backBtn = document.getElementById('backToSignInBtn');

      const hideStatus = () => {
        errorDiv.hidden = true;
        successDiv.hidden = true;
      };

      backBtn.addEventListener('click', () => navigateWithLoader('/'));

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        hideStatus();

        const email = emailInput.value.trim();
        if (!email || !emailInput.checkValidity()) {
          errorDiv.textContent = 'Enter a valid email address.';
          errorDiv.hidden = false;
          emailInput.focus();
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending…';

        try {
          const response = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            cache: 'no-store',
            body: JSON.stringify({ email })
          });

          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data?.error || 'Unable to send the recovery request.');

          successText.textContent = `${data?.message || 'If an account exists, a reset link was sent.'} Please also check your spam or junk folder if you do not see it.`;
          successDiv.hidden = false;
          form.reset();
        } catch (error) {
          errorDiv.textContent = error?.message || 'A network error occurred. Please try again.';
          errorDiv.hidden = false;
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send Recovery Link';
        }
      });
    })();
  </script>
</body>

</html>
