<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Recover and reset your account access for the MFC Youth Area Management System.">
  <meta name="theme-color" content="#002847">
  <title>Forgot Password - MFC Youth Area Management System</title>
  <style>
    @import url('https://fonts.cdnfonts.com/css/visby');
  </style>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/img/logo-2.png">
</head>

<body class="auth-body">
  <main class="auth-page">
    <section class="login-card auth-card" aria-labelledby="recoverTitle">
      <div class="login-header">
        <img class="logo-mark" src="/img/logo.png" alt="MFC Youth Logo">
        <h1 id="recoverTitle">Forgot Your Password?</h1>
        <p>Enter your email address to receive a recovery link.</p>
      </div>
      <form class="login-form" id="forgotPasswordForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        
        <div class="form-errors" id="forgotPasswordError" style="display: none; margin-bottom: 1rem;"></div>
        <div class="form-success auth-alert auth-alert-success" id="forgotPasswordSuccess" style="display: none; margin-bottom: 1rem; padding: 1rem; background-color: #ecfdf5; color: #065f46; border-radius: 0.5rem; border: 1px solid #a7f3d0; display: flex; align-items: flex-start; gap: 0.75rem;">
          <svg style="width: 1.25rem; height: 1.25rem; flex-shrink: 0; margin-top: 0.125rem;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <div style="font-size: 0.875rem; line-height: 1.25rem;">
            <strong style="display: block; font-weight: 600; margin-bottom: 0.25rem;">Check your email</strong>
            <span id="forgotPasswordSuccessText">If an account exists, a reset link has been sent. Please also check your spam or junk folder if you don't see it.</span>
          </div>
        </div>

        <div class="login-buttons">
          <button class="btn-auth btn-primary" type="submit" id="submitBtn">Send Recovery Link</button>
          <button class="btn-auth btn-secondary" type="button" onclick="navigateWithLoader('/')">Back to Sign In</button>
        </div>
      </form>
    </section>
  </main>
  
  <script src="/js/loader.js"></script>
  <script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const errorDiv = document.getElementById('forgotPasswordError');
      const successDiv = document.getElementById('forgotPasswordSuccess');
      const submitBtn = document.getElementById('submitBtn');
      
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      try {
        const response = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        
        const data = await response.json();
        
        // We always show success to prevent enumeration
        if (data.message) {
          // If the backend sends a custom message, update only the text portion
          document.getElementById('forgotPasswordSuccessText').textContent = data.message + " Please also check your spam or junk folder if you don't see it.";
        }
        successDiv.style.display = 'flex'; // Use flex for the icon layout
        document.getElementById('forgotPasswordForm').reset();
      } catch (err) {
        errorDiv.textContent = 'A network error occurred. Please try again.';
        errorDiv.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Recovery Link';
      }
    });
  </script>
</body>

</html>
