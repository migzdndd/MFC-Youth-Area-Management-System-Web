<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Change the email address used for your MFC Youth Area Management System account.">
  <meta name="theme-color" content="#002847">
  <title>Change Email - MFC Youth Area Management System</title>
  <style>@import url('https://fonts.cdnfonts.com/css/visby');</style>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/img/logo-2.png">
</head>
<body class="auth-body" data-allow-authenticated="true">
  <main class="auth-page">
    <section class="login-card auth-card" aria-labelledby="changeEmailTitle">
      <div class="login-header">
        <img class="logo-mark" src="/img/logo.png" alt="MFC Youth Logo">
        <h1 id="changeEmailTitle">Change Account Email</h1>
        <p>For your security, Supabase may require confirmation before the new email becomes active.</p>
      </div>
      <form class="login-form" id="changeEmailForm" novalidate>
        <div id="changeEmailMessage"></div>
        <div class="verification-badge"><span>Current email</span><strong id="changeEmailCurrent">-</strong></div>
        <label class="auth-control-label" for="newAccountEmail">New Email Address</label>
        <div class="login-field">
          <input class="login-input" id="newAccountEmail" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <p class="field-help auth-help">Your member record will synchronize only after Supabase confirms the Auth email change.</p>
        <div class="login-buttons">
          <button class="btn-auth btn-primary" type="submit">Request Email Change</button>
          <button class="btn-auth btn-dark" id="backFromEmailButton" type="button">Back</button>
        </div>
      </form>
    </section>
  </main>
  <script src="/js/loader.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
