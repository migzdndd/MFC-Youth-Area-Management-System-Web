<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Reset your password for the MFC Youth Area Management System.">
  <meta name="theme-color" content="#002847">
  <title>Reset Password - MFC Youth Area Management System</title>
  <style>@import url('https://fonts.cdnfonts.com/css/visby');</style>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/img/logo-2.png">
</head>
<body class="auth-body">
  <main class="auth-page">
    <section class="login-card auth-card" aria-labelledby="resetTitle">
      <div class="login-header">
        <img class="logo-mark" src="/img/logo.png" alt="MFC Youth Logo">
        <h1 id="resetTitle">Set New Password</h1>
        <p>Enter and confirm a new password for your account.</p>
      </div>
      <form class="login-form" id="resetPasswordForm" novalidate>
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" name="newPassword" required minlength="8" autocomplete="new-password">
          <small>Must be at least 8 characters with at least one letter and one number.</small>
        </div>
        <div class="form-group">
          <label for="confirmNewPassword">Confirm New Password</label>
          <input type="password" id="confirmNewPassword" name="confirmNewPassword" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-errors" id="resetPasswordError" style="display:none;color:red;margin-bottom:1rem;"></div>
        <div class="form-success" id="resetPasswordSuccess" style="display:none;color:green;margin-bottom:1rem;"></div>
        <div class="login-buttons">
          <button class="btn-auth btn-primary" type="submit" id="submitBtn">Save New Password</button>
          <button class="btn-auth btn-secondary" type="button" onclick="navigateWithLoader('/forgot-password')">Request a New Link</button>
        </div>
      </form>
    </section>
  </main>
  <script src="/js/loader.js"></script>
  <script>
    const resetState = { tokenHash: '' };

    document.addEventListener('DOMContentLoaded', () => {
      const query = new URLSearchParams(window.location.search);
      const tokenHash = String(query.get('token_hash') || '').trim();
      const recoveryType = String(query.get('type') || '').trim().toLowerCase();
      const errorDiv = document.getElementById('resetPasswordError');
      const submitBtn = document.getElementById('submitBtn');

      // Remove credentials from the address bar immediately after reading them.
      window.history.replaceState({}, document.title, window.location.pathname);

      if (!tokenHash || recoveryType !== 'recovery') {
        errorDiv.textContent = 'Invalid or missing recovery token. Please request a new password reset link.';
        errorDiv.style.display = 'block';
        submitBtn.disabled = true;
        return;
      }

      resetState.tokenHash = tokenHash;
    });

    document.getElementById('resetPasswordForm').addEventListener('submit', async event => {
      event.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmation = document.getElementById('confirmNewPassword').value;
      const errorDiv = document.getElementById('resetPasswordError');
      const successDiv = document.getElementById('resetPasswordSuccess');
      const submitBtn = document.getElementById('submitBtn');

      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      if (!resetState.tokenHash) return;
      if (newPassword.length < 8 || !/[A-Za-z]/.test(newPassword) || !/\d/.test(newPassword)) {
        errorDiv.textContent = 'Password must be at least 8 characters and contain at least one letter and one number.';
        errorDiv.style.display = 'block';
        return;
      }
      if (newPassword !== confirmation) {
        errorDiv.textContent = 'The new passwords do not match.';
        errorDiv.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          cache: 'no-store',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token_hash: resetState.tokenHash, newPassword })
        });
        const data = await response.json().catch(() => ({ ok: false, error: 'The server returned an invalid response.' }));

        if (!response.ok || !data.ok) {
          throw new Error(data.error || 'Failed to reset password.');
        }

        resetState.tokenHash = '';
        successDiv.textContent = data.message || 'Password reset successfully. Please sign in with your new password.';
        successDiv.style.display = 'block';
        document.getElementById('resetPasswordForm').reset();
        submitBtn.style.display = 'none';
        setTimeout(() => navigateWithLoader('/'), 2000);
      } catch (error) {
        errorDiv.textContent = error?.message || 'A network error occurred. Please try again.';
        errorDiv.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save New Password';
      }
    });
  </script>
</body>
</html>
